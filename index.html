<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help Me Cook</title>

    <link rel="stylesheet" href="css/styles.css" type="text/css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <!-- Theme script loaded early to avoid flash of wrong theme -->
    <script src="js/theme.js"></script>
</head>

<body>

<div class="bg-image"></div>

<!-- Discreet theme toggle: cycles Auto → Light → Dark -->
<button id="theme-toggle" aria-label="Theme: Auto" data-current-theme="auto" title="Toggle theme">
    <i class="theme-icon fa fa-fw fa-adjust"></i>
    <span class="theme-label">Auto</span>
</button>

<div class="container d-col d-wrap title">

    <h1> Help me Cook </h1>

    <div id="recipe_ingredient" class="container d-row d-wrap">

                <div class="container d-col d-wrap" id="ingredients">
                    <h2 style="margin-left: 15px;"> Ingredients </h2>

                        <details class="chip-dropdown" open>
                            <summary class="chip-dropdown-summary">Spices</summary>
                            <div class="chip-dropdown-body is-open">
                                <div class="container d-row d-wrap" id="spices_checkBoxes"></div>
                            </div>
                        </details>

                        <details class="chip-dropdown">
                            <summary class="chip-dropdown-summary">Vegetables</summary>
                            <div class="chip-dropdown-body">
                                <div class="container d-row d-wrap" id="vegetables_checkBoxes"></div>
                            </div>
                        </details>

                    </div>

                </div>

        <div class="container d-col d-wrap" id="recipe_list">
            <h2> Recipes </h2>
            <form onsubmit="return false" id="recipe_search_form">
                <input type="text" onkeyup="updateRecipeFilter()" placeholder="Search Recipes: Okra Potato" id="recipe_search" aria-label="Search Recipes">
            </form>
        </div>

    </div>

</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
<script src="js/class/ingredients.js" type="text/javascript"></script>
<script src="js/class/myRecipe.js" type="text/javascript"></script>
<script src="js/globalFunctions.js" type="text/javascript"></script>
<script src="js/createIngredients.js?v=2" type="text/javascript"></script>
<script src="js/recipe_instructions.js" type="text/javascript"></script>
<script src="js/createRecipes.js" type="text/javascript"></script>
<script src="js/index.js" type="text/javascript"></script>

</body>
</html>
